<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Commander chez Deling Lbk</title>
    <!-- Ajoute ton CSS ici -->
</head>
<body>
    <h1>Bienvenue sur mon espace Freelance</h1>
    <p>Prêt à lancer ton projet ? Remplis ce formulaire :</p>
    
    <form action="/commander" method="POST">
        <input type="text" name="nom" placeholder="Ton Nom" required><br>
        <input type="text" name="whatsapp" placeholder="Ton Numéro WhatsApp" required><br>
        <input type="text" name="projet" placeholder="Type de Projet" required><br>
        <input type="number" name="budget" placeholder="Budget estimé ($)" required><br>
        <button type="submit">Envoyer ma commande</button>
    </form>
</body>
</html>
