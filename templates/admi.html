<!DOCTYPE html>
<html lang="fr">
<body>
    <h1>Dashboard Admin (Privé) ⚡</h1>
    <div class="stats">
        <p>Total Prospects : {{ total_prospects }}</p>
        <p>Chiffre d'Affaires Potentiel : {{ chiffre_affaires }}$</p>
    </div>

    <h2>Liste des clients</h2>
    <table border="1">
        <tr><th>Nom</th><th>WhatsApp</th><th>Projet</th><th>Budget</th></tr>
        {% for client in clients %}
        <tr>
            <td>{{ client[1] }}</td>
            <td>{{ client[2] }}</td>
            <td>{{ client[3] }}</td>
            <td>{{ client[4] }}$</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
